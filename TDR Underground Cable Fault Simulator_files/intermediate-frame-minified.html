<iframe id="innerFrame" name="innerFrame" sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-storage-access-by-user-activation" frameborder="0" allowfullscreen="" src="./inner-frame-minified.html" scrolling="auto" style="overflow: auto; pointer-events: auto;">
</iframe>

<script>
  let policy;
  if (window.trustedTypes && window.trustedTypes.createPolicy) {
    policy = window.trustedTypes.createPolicy('atari-gapi-loader', {
      createScriptURL: (url) => {
        if (url === 'https://apis.google.com/js/api.js?checkCookie=1') {
          return url;
        }
        throw new Error('Attempted to load unexpected script URL');
      }
    });
  }

  function loadGapi() {
    var loaderScript = document.createElement('script');
    var url = 'https://apis.google.com/js/api.js?checkCookie=1';
    if (policy) {
      loaderScript.src = policy.createScriptURL(url);
    } else {
      loaderScript.setAttribute('src', url);
    }
    loaderScript.onload = function() {
      this.onload = function() {};
      loadGapiClient();
    };
    loaderScript.onreadystatechange = function() {
      if (this.readyState === 'complete') {
        this.onload();
      }
    };
    (document.head || document.body || document.documentElement).appendChild(loaderScript);
  }

  function updateInnerFrame(url, enableInteraction, forceIosScrolling) {
    var urlEl = document.createElement('a');
    urlEl.setAttribute('href', url);
    if (urlEl.protocol != "https:" && urlEl.protocol != "http:") {
      // Do not allow updating the iframe's src to anything other than https or http (used for local
      // servers), specifically javascript:
      return;
    }
    var iframe = document.getElementById('innerFrame');
    iframe.src = url;
    iframe.onload = function() {
      gapi.rpc.call('..', 'innerFrameLoaded');
    };

    if (enableInteraction) {
      if (forceIosScrolling) {
        var iframeParent = iframe.parentElement;
        iframeParent.classList.add('forceIosScrolling');
      } else {
        iframe.style.overflow = 'auto';
      }
    } else {
      iframe.style.pointerEvents = 'none';
    }
  }

  function updateInnerIframeCode(userCode, enableInteraction, forceIosScrolling, enableHtmlSitesGenAi, isLiquidArtifact = false, inEditor = false, enableLiquidAppsVerticalScrolling = false, isFullPageEmbed = false, isInteractiveFullPageEmbed = false, textEditLabels = null, enableLiquidAppsObjectSegmentation = false, enableLiquidAppsEmbeddedPix = false) {
    if (((enableHtmlSitesGenAi && isLiquidArtifact) || isInteractiveFullPageEmbed) && enableInteraction) {
      var innerFrame = document.getElementById('innerFrame');
      if (innerFrame) {
        innerFrame.style.pointerEvents = 'auto';
        if (enableLiquidAppsVerticalScrolling) {
          // The frame grows to fit its content, so only horizontal overflow
          // can scroll.
          innerFrame.style.overflowX = 'auto';
          innerFrame.style.overflowY = 'hidden';
          innerFrame.setAttribute('scrolling', 'no');
        } else {
          innerFrame.setAttribute('scrolling', 'auto');
        }
      }
    }
    gapi.rpc.setup('innerFrame');
    gapi.rpc.call(
      'innerFrame',
      'updateUserHtmlFrame',
      undefined /* opt_callback */,
      userCode,
      enableInteraction,
      forceIosScrolling,
      enableHtmlSitesGenAi,
      isLiquidArtifact,
      inEditor,
      enableLiquidAppsVerticalScrolling,
      isFullPageEmbed,
      isInteractiveFullPageEmbed,
      textEditLabels,
      enableLiquidAppsObjectSegmentation,
      enableLiquidAppsEmbeddedPix);
  }

  const MessageAction = {
    BACKGROUND_COLOR: 'ATARI_CODE_EMBED_BACKGROUND_COLOR',
    GENAI_TEXT_EDIT: 'ATARI_GENAI_TEXT_EDIT',
    GENAI_TEXT_FORMAT: 'ATARI_GENAI_TEXT_FORMAT',
    IMAGE_CLICK: 'ATARI_CODE_EMBED_IMAGE_CLICK',
    JS_CRASH: 'onJsCrash',
    REDO: 'ATARI_CODE_EMBED_REDO',
    RESIZE: 'ATARI_CODE_EMBED_RESIZE',
    UNDO: 'ATARI_CODE_EMBED_UNDO'
  };

  function onPostMessage(ev) {
    var innerFrame = document.getElementById('innerFrame');
    var type = ev.data && ev.data['type'];
    if (ev.data['magic'] != 'SHIC' && (type != MessageAction.GENAI_TEXT_EDIT && type != MessageAction.GENAI_TEXT_FORMAT && type != MessageAction.IMAGE_CLICK && type != MessageAction.JS_CRASH && type != MessageAction.RESIZE && type != MessageAction.BACKGROUND_COLOR && type != MessageAction.UNDO && type != MessageAction.REDO || !innerFrame || ev.source !== innerFrame.contentWindow)) {
      return;
    }
    switch (type) {
      case 'resize':
        var height = ev.data['height'];
        gapi.rpc.call('..', 'resize', undefined /* opt_callback */, height);
        break;
      case MessageAction.GENAI_TEXT_EDIT:
      case MessageAction.GENAI_TEXT_FORMAT:
      case MessageAction.IMAGE_CLICK:
      case MessageAction.RESIZE:
      case MessageAction.BACKGROUND_COLOR:
      case MessageAction.UNDO:
      case MessageAction.REDO:
        window.parent.postMessage(ev.data, '*');
        break;
      case MessageAction.JS_CRASH:
        gapi.rpc.call('..', 'onJsCrash', undefined /* opt_callback */, {
          message: ev.data['message'],
          stack: ev.data['stack']
        });
        break;
    }
  }

  function onGapiInitialized() {
    // Inform the parent frame that GAPI has been initialized.
    gapi.rpc.call('..', 'gapiInitialized');
    gapi.rpc.register('updateInnerFrame', updateInnerFrame);
    gapi.rpc.register('updateInnerIframeCode', updateInnerIframeCode);
    window.addEventListener('message', onPostMessage);
  }

  function loadGapiClient() {
    gapi.load('gapi.rpc', onGapiInitialized);
  }

  if (document.readyState == 'complete') {
    loadGapi();
  } else {
    self.addEventListener('load', loadGapi);
  }
</script>
